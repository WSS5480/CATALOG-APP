services:
  - type: web
    name: catalog-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ETL_BASE_URL      # https://your-etl-space.onrender.com
        sync: false
      - key: ETL_API_TOKEN     # API_TOKEN set on your ETL Space
        sync: false
      - key: DS_CATALOG        # dataset holding products
        sync: false
      - key: DS_USERS          # dataset holding districts/stores/managers
        sync: false
      - key: DS_VENDORS        # dataset holding vendors
        sync: false
      - key: DS_FREIGHT        # optional
        sync: false
      - key: APP_PASSWORD      # password to open this app
        sync: false
