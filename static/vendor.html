<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Editor</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background: #f4f4f4; color: #222; }
  .topbar { background:#fff; color:#0C447C; border-bottom:1px solid #e0e0e0; padding: 12px 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .topbar h1 { font-size: 1.15rem; margin: 0; letter-spacing: .5px; }
  .tabs { display: flex; gap: 6px; margin-left: 8px; }
  .tab-btn { background:#fff; color:#0C447C; border:1px solid #0C447C; padding: 7px 16px; border-radius: 5px 5px 0 0; cursor: pointer; font-size: .9rem; }
  .tab-btn.active { background:#0C447C; color:#fff; font-weight: bold; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 18px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  .controls input[type="text"], .controls select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: .9rem; }
  .controls input[type="text"] { min-width: 260px; }
  .count { color: #777; font-size: .85rem; margin-left: auto; }
  /* Catalog grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 16px 18px; }
  .card { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card-img { width: 100%; height: 150px; object-fit: contain; background: #fff; border-bottom: 1px solid #f0f0f0; }
  .card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-name { font-weight: bold; font-size: .9rem; line-height: 1.2; }
  .card-sub { color: #777; font-size: .72rem; text-transform: uppercase; }
  .card-meta { font-size: .78rem; color: #444; margin-top: 2px; }
  .card-meta b { color: #0C447C; }
  .do-pill { display: inline-block; background: #eef3f8; color: #0C447C; font-size: .72rem; padding: 1px 7px; border-radius: 10px; }
  .btn { border: none; border-radius: 5px; padding: 8px 14px; cursor: pointer; font-size: .85rem; }
  .btn-edit { background: #1a73e8; color: #fff; margin-top: 8px; } .card-body .btn-edit { margin-top: auto; }
  .btn-edit:hover { background: #1558b0; }
  .btn-primary { background: #27ae60; color: #fff; }
  .btn-primary:hover { background: #1e8449; }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-danger { background: #e53935; color: #fff; }
  .btn-danger:hover { background: #c62828; }
  .btn-sm { padding: 5px 10px; font-size: .78rem; }
  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: flex-start; justify-content: center; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 720px; max-width: 94vw; margin: 20px auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .modal-head { background: #0C447C; color: #fff; padding: 14px 18px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .modal-head h2 { margin: 0; font-size: 1rem; }
  .modal-head .x { cursor: pointer; font-size: 1.3rem; line-height: 1; background: none; border: none; color: #fff; }
  .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1 1 auto; }
  #fieldBlocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
  #fieldBlocks .field-block { margin-bottom: 0; }
  .edit-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }
  .edit-row label { font-size: .8rem; font-weight: bold; color: #555; }
  .edit-row .current { font-size: .82rem; color: #333; padding: 6px 8px; background: #f6f6f6; border-radius: 4px; min-height: 30px; display: flex; align-items: center; word-break: break-word; }
  .edit-row .new-wrap { grid-column: 2; }
  .edit-row input { width: 100%; padding: 7px 9px; border: 1px solid #bbb; border-radius: 4px; font-size: .85rem; }
  .edit-row input::placeholder { color: #aaa; font-style: italic; }
  .field-block { border: 1px solid #eee; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .field-block.fb-wide { grid-column: span 2; }
  .field-block .fb-label { font-size: .74rem; font-weight: bold; color: #0C447C; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 4px; }
  .field-block .fb-current { font-size: .8rem; color: #555; margin-bottom: 6px; }
  .field-block .fb-current span { color: #222; font-weight: bold; }
  .modal-foot { padding: 12px 18px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }
  .editor-line { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .editor-line label { font-size: .8rem; font-weight: bold; color: #555; white-space: nowrap; }
  .editor-line input { flex: 1; padding: 7px 9px; border: 1px solid #bbb; border-radius: 4px; font-size: .85rem; }
  .modal-msg { font-size: .82rem; padding: 8px 18px; }
  .modal-msg.ok { color: #1e8449; }
  .modal-msg.err { color: #c62828; }
  /* Log table */
  .log-wrap { padding: 16px 18px; overflow-x: auto; }
  table.log { width: 100%; border-collapse: collapse; background: #fff; font-size: .82rem; }
  table.log th { background: #0C447C; color: #fff; text-align: left; padding: 8px 10px; white-space: nowrap; }
  table.log td { padding: 7px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  table.log tr:nth-child(even) td { background: #fafafa; }
  .chg { color: #c62828; font-weight: bold; }
  .chg .old { color: #999; text-decoration: line-through; font-weight: normal; margin-right: 5px; }
  .nochg { color: #555; }
  .loading { color: #888; font-style: italic; padding: 24px 18px; }
  .empty { color: #888; padding: 24px 18px; }
  .err-banner { background: #ffebee; color: #c62828; padding: 10px 18px; font-size: .85rem; border-bottom: 1px solid #ffcdd2; }
  .hide { display: none !important; }
.card{position:relative}.card-img{transition:transform .18s ease;cursor:zoom-in}.card:hover .card-img{transform:none}.sale-badge{position:absolute;top:0;left:0;background:#e53935;color:#fff;font-size:.74rem;font-weight:bold;padding:4px 10px;border-bottom-right-radius:6px;letter-spacing:.5px;z-index:3}.card.is-sale .reg-val{text-decoration:line-through;color:#999;font-weight:normal}.card.is-sale .promo-val{color:#e53935}.card-stock{font-size:.73rem;color:#0C447C;margin-top:2px}.sb-badge,.dl-badge{position:absolute;top:0;right:0;color:#fff;font-size:.74rem;font-weight:bold;padding:4px 10px;border-bottom-left-radius:6px;letter-spacing:.5px;z-index:3}.sb-badge{background:#1d4ed8}.dl-badge{background:#a16207}.ql-badge{position:absolute;top:0;right:0;color:#fff;font-size:.74rem;font-weight:bold;padding:4px 10px;border-bottom-left-radius:6px;letter-spacing:.5px;z-index:3;background:#16213f}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}</style>
<style id="railProtoCss">#catalogView .controls{background:#fff;border:1.5px solid #0C447C;border-radius:12px;padding:14px 16px !important;display:flex !important;flex-wrap:wrap;align-items:center;gap:12px !important;margin-bottom:16px;}#catalogView .controls #search{order:2;flex:1 1 260px;height:42px !important;border:1px solid #0C447C !important;border-radius:22px !important;padding:0 18px !important;font-size:15px !important;min-width:120px;}#catalogView .controls button{order:3;flex:0 0 auto;background:#fff !important;color:#0C447C !important;border:1px solid #0C447C !important;border-radius:18px !important;font-size:14px !important;font-weight:600 !important;padding:9px 16px !important;}#catalogView .controls select{order:5;flex:0 0 auto;border:1px solid #0C447C !important;background:#fff !important;color:#0C447C !important;border-radius:18px !important;padding:9px 16px !important;font-size:14px !important;font-weight:600;height:40px;color:#0C447C !important;box-shadow:0 1px 3px rgba(0,0,0,.15);}#catalogView .controls .count,#catalogView .controls #catCount{order:9;flex:1 1 100%;color:#0C447C !important;font-size:13px !important;margin:6px 0 0 !important;text-align:left;}</style>
<style id="qc-theme">
:root{--brand:#e0592a;--brand-d:#c04212;--ink:#1b2130;--mut:#6b7280;--line:#e8e9ef;--bg:#f5f6fa;--good:#12925f;--gold:#f5a623;--navy:#16213f;}
body{background:var(--bg)!important;color:var(--ink)!important;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif!important;}
.topbar{background:var(--navy)!important;border-bottom:0!important;box-shadow:0 8px 24px rgba(14,23,48,.18)!important;}
.topbar h1{color:#fff!important;font-weight:800!important;letter-spacing:-.3px!important;}
.tab-btn{background:transparent!important;color:rgba(255,255,255,.82)!important;border:0!important;border-radius:20px!important;font-weight:600!important;}
.tab-btn:hover{color:#fff!important;}
.tab-btn.active{background:#2b3c62!important;color:#fff!important;font-weight:700!important;}
.controls{background:#fff!important;border-radius:16px!important;box-shadow:0 2px 10px rgba(20,20,40,.05)!important;}
.controls input[type="text"],.controls select{border:1px solid var(--line)!important;border-radius:12px!important;}
.btn-primary{background:var(--brand)!important;color:#fff!important;border-radius:12px!important;font-weight:800!important;border:0!important;}
.btn-primary:hover{background:var(--brand-d)!important;}
.btn-secondary{border-radius:12px!important;}
.btn-danger{border-radius:10px!important;}
.card{background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;overflow:hidden!important;transition:.15s!important;}
.card:hover{box-shadow:0 8px 24px rgba(20,20,40,.10)!important;transform:translateY(-2px);}
.card-img{background:#fff!important;padding:8px!important;}
.card-name{color:var(--ink)!important;font-weight:600!important;}
.card-sub{color:var(--mut)!important;letter-spacing:.3px!important;}
.card-meta{color:var(--mut)!important;}
.card-meta b{color:var(--brand)!important;font-weight:800!important;}
.do-pill{background:#fff5f0!important;color:var(--brand)!important;border-radius:8px!important;font-weight:700!important;}
.btn-edit{background:var(--brand)!important;color:#fff!important;border-radius:12px!important;font-weight:800!important;border:0!important;}
.btn-edit:hover{background:var(--brand-d)!important;}
.modal{border-radius:18px!important;overflow:hidden!important;}
.modal-head{background:var(--navy)!important;}
.field-block{border:1px solid var(--line)!important;border-radius:12px!important;background:#fafbfd!important;}
#pfOverlay > div{border-radius:18px!important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c9cdd9;border-radius:5px;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>CATALOG EDITOR</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tabCatalog" onclick="showView('catalog')">Catalog</button>
      <button class="tab-btn" id="tabLog" onclick="showView('log')">Edit Log</button>
    </div>
  </div>

  <div id="errBanner" class="err-banner hide"></div>

  <!-- ============ CATALOG VIEW ============ -->
  <div id="catalogView">
    <div class="controls">
      <input type="text" id="search" placeholder="Search name, model #, vendor..." oninput="renderGrid()">
      <button onclick="openAdd()" style="margin-left:8px;padding:6px 14px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600">+ Add Item</button>
      <select id="vendorFilter" onchange="renderGrid()"><option value="">All Vendors</option></select>
      <select id="sortSel" onchange="renderGrid()">
        <option value="display">Sort: Display Order</option>
        <option value="name">Sort: Name (A-Z)</option>
        <option value="vendor">Sort: Vendor</option>
      </select>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer;margin-left:8px;white-space:nowrap"><input type="checkbox" id="edSaleOnly" onchange="renderGrid()"> SALE only</label><label style="display:inline-flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer;margin-left:8px;white-space:nowrap"><input type="checkbox" id="edSBOnly" onchange="renderGrid()"> Special Buys</label><label style="display:inline-flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer;margin-left:8px;white-space:nowrap"><input type="checkbox" id="edGroupOnly" onchange="renderGrid()"> Groups</label>
      <span class="count" id="catCount"></span>
    </div>
    <div id="grid" class="grid"><div class="loading">Loading catalog...</div></div>
  </div>

  <!-- ============ LOG VIEW ============ -->
  <div id="logView" class="hide">
    <div class="controls">
      <button class="btn btn-secondary btn-sm" onclick="loadLog()">Refresh</button>
      <select id="logVendorFilter" onchange="renderLog()"><option value="">All Vendors</option></select>
      <span class="count" id="logCount"></span>
    </div>
    <div class="log-wrap" id="logWrap"><div class="loading">Loading log...</div></div>
  </div>

  <!-- ============ EDIT MODAL ============ -->
  <div class="overlay" id="editOverlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Edit Item</h2>
        <button class="x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="editor-line">
          <label>Edited by</label>
          <input type="text" id="editorName" placeholder="Your name">
        </div>
        <div id="fieldBlocks"></div>
        <div class="editor-line" style="margin-top:8px"><label>Expiration Date</label><input type="date" id="expDate"></div>
        <div class="editor-line" style="margin-top:6px"><label>Special Buy</label><label style="display:flex;align-items:center;gap:8px;font-weight:400;"><input type="checkbox" id="edSB" style="width:auto;"> Show SPECIAL BUY banner <input id="edSBQty" type="number" min="0" placeholder="QTY" title="Special Buy quantity available" style="width:80px;margin-left:10px;padding:4px 6px;border:1px solid #ccc;border-radius:4px"></label></div>
        <div style="font-size:.72rem;color:#888;margin:-2px 0 6px 0">Optional — this edit auto-deletes at 12:00 AM on the selected date.</div>
      </div>
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   Catalog Editor brick
   - Reads MASTER CATALOG via the brick data proxy (alias: catalog)
   - Writes / reads / deletes edit records in AppDB collection: CatalogEdits
   ============================================================ */

var COLLECTION = 'CatalogEdits';
var DATA_BASE  = '/api/app/rows/catalog';
var COLL_BASE  = '/api/app/collections/' + COLLECTION + '/documents/';
var COLLECTION_NEW = "CatalogEdits";
var COLL_NEW_BASE  = "/api/app/collections/" + COLLECTION_NEW + "/documents/";
var addMode = false;

/* The six editable fields, in display order. key = collection column / catalog field */
var FIELDS = [
  { key: 'Vendor', label: 'Vendor', type: 'text', readonly: true },
  { key: 'ItemName', label: 'Item Name',          type: 'text' },
  { key: 'ModelNum', label: 'Model #', type: 'text', readonly: true },
  { key: 'DisplayOrder', label: 'Display Order', type: 'number' },
  { key: 'RegularCost', label: 'Regular Cost', type: 'number', readonly: true },
  { key: 'PromoCost', label: 'Promo Cost', type: 'number' },
  { key: 'QTYAvailable', label: 'QTY Available', type: 'number' },
  { key: "ItemImage2", label: "Photo (Image URL)", type: "text" }
,
  { key: 'GroupFlag', label: 'Group Flag (Yes = group)', type: 'select' }
];

var products = [];     // deduped catalog rows
var logDocs  = [];     // collection docs {id, content}
var current  = null;   // item currently in the modal
var editingDocId = null; // when editing an existing log entry var editingColl = null;

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(x){ if(x==null) return NaN; var n=parseFloat(String(x).replace(/[^0-9.\-]/g,'')); return isNaN(n)?NaN:n; }
function money(x){ var n=num(x); return isNaN(n)?'' : '$'+n.toFixed(2); }
function dispOrd(p){ var d=parseFloat(p && p.DisplayOrder); return isNaN(d)?99999:d; }

function currentUser(){
  try{
    var U=window.__CAT_USER||{}; if(U.name) return U.name; 
    var p = new URLSearchParams(location.search);
    if(U.email && !p.get('userEmail')){ var t=String(U.email).split('@')[0].split(/[._\-]+/).filter(Boolean).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' '); if(t) return t; }
    var nm=(p.get('userName')||p.get('displayName')||p.get('userDisplayName')||p.get('fullName')||'').trim();
        var em=(p.get('userEmail')||p.get('email')||p.get('user')||'').trim();
        function titleize(s){ return s.split(/[._\-]+/).filter(Boolean).map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(' '); }
        if(nm && nm.indexOf('@')===-1 && /[a-zA-Z]/.test(nm)) return nm;
        var src=(nm && nm.indexOf('@')>-1)?nm:em;
        if(src && src.indexOf('@')>-1) return titleize(src.split('@')[0]);
        return nm||'';
  }catch(e){ return ''; }
}

function showErr(msg){ var b=$('errBanner'); if(!msg){ b.className='err-banner hide'; b.textContent=''; return; } b.className='err-banner'; b.textContent=msg; }

/* ---------- view switching ---------- */
function showView(v){
  var isCat = (v === 'catalog');
  $('catalogView').classList.toggle('hide', !isCat);
  $('logView').classList.toggle('hide', isCat);
  $('tabCatalog').classList.toggle('active', isCat);
  $('tabLog').classList.toggle('active', !isCat);
  if(!isCat) loadLog();
}

/* ---------- load catalog ---------- */
async function loadCatalog(){
  var fields = 'ModelNum,ItemName,Vendor,Brand,Category,RegularCost,PromoCost,ItemImage2,DisplayOrder,QTYAvailable,GroupFlag';
  var Q = String.fromCharCode(63), AMP = String.fromCharCode(38);
  var url = DATA_BASE + Q + 'groupby=' + fields + AMP + 'limit=200000'+AMP+'_cb='+Date.now();
  var rows = [];
  try{
    var r = await fetch(url, { credentials: 'include' });
    if(r.ok){ rows = await r.json(); }
    else {
      // resilient fallback: drop possibly-unmapped columns and retry
      var url2 = url.split(',DisplayOrder').join('').split('PromoCost,').join('');
      var r2 = await fetch(url2, { credentials: 'include' });
      if(r2.ok) rows = await r2.json();
      else { showErr('Could not load catalog data (HTTP ' + r.status + '). Check the dataset is wired to alias "catalog".'); }
    }
  }catch(e){ showErr('Catalog load error: ' + e.message); }

  // normalize + dedupe by Vendor|ModelNum|ItemName
  var seen = {}, out = [];
  (rows || []).forEach(function(r){
    if(!r || typeof r !== 'object') return;
    var key = (r.Vendor||'') + '||' + (r.ModelNum||'') + '||' + (r.ItemName||'');
    if(seen[key]) return; seen[key] = 1;
    out.push({
      Vendor: r.Vendor || '', ItemName: r.ItemName || '', ModelNum: r.ModelNum || '', GroupFlag: r.GroupFlag || '',
      Brand: r.Brand || '', Category: r.Category || '',
      RegularCost: r.RegularCost, PromoCost: r.PromoCost, Price: (function(){var rc=parseFloat(r.RegularCost),pc=parseFloat(r.PromoCost);rc=isNaN(rc)?0:rc;pc=isNaN(pc)?0:pc;return (rc>0&&pc>0)?Math.min(rc,pc):(pc>0?pc:rc);})(),
      DisplayOrder: r.DisplayOrder, ItemImage2: r.ItemImage2 || '', QTYAvailable: r.QTYAvailable
    });
  });
  products = out;
  buildVendorFilter();
  renderGrid();
}

function buildVendorFilter(){
  var sel = $('vendorFilter'); var vendors = {};
  products.forEach(function(p){ if(p.Vendor && !/^\d+$/.test(p.Vendor)) vendors[p.Vendor] = 1; });
  var list = Object.keys(vendors).sort();
  sel.innerHTML = '<option value="">All Vendors</option>' + list.map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
}

function renderGrid(){
  var q = ($('search').value || '').trim().toLowerCase();
  var vf = $('vendorFilter').value;
  var sort = $('sortSel').value;
  var list = products.filter(function(p){
    if(vf && p.Vendor !== vf) return false;
    if(q){
      var hay = (p.ItemName+' '+p.ModelNum+' '+p.Vendor).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    if(($('edSaleOnly')||{}).checked){var _r1=parseFloat(p.RegularCost),_p1=parseFloat(p.PromoCost);if(!(_p1>0&&_r1>0&&_p1<_r1))return false;}
    if(($('edSBOnly')||{}).checked){var _sm1=window.__sbMap;var _se1=_sm1&&_sm1[String(p.ModelNum||'').trim().toUpperCase()];if(!(_se1&&_se1.sb))return false;}
    if(($('edGroupOnly')||{}).checked&&String(p.GroupFlag||'').trim().toLowerCase()!=='yes')return false;
    return true;
  });
  list.sort(function(a,b){
    if(sort === 'name')   return String(a.ItemName||'').localeCompare(String(b.ItemName||''));
    if(sort === 'vendor') return String(a.Vendor||'').localeCompare(String(b.Vendor||''));
    var da = dispOrd(a), db = dispOrd(b);
    if(da !== db) return da - db;
    return String(a.ItemName||'').localeCompare(String(b.ItemName||''));
  });

  $('catCount').textContent = list.length + ' item' + (list.length===1?'':'s');
  var grid = $('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">No items match.</div>'; return; }

  // cap render for performance; search to narrow
  var MAX = 600;
  var slice = list.slice(0, MAX);
  grid.innerHTML = slice.map(function(p, i){
    var img = p.ItemImage2 ? '<img class="card-img" src="'+esc(p.ItemImage2)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<div class="card-img"></div>';
